<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Panel | Sabana Cake Studio</title>

    <link rel="stylesheet" href="admin.css">
</head>

<body>

    <header class="admin-header">

        <div class="admin-logo">
            Sabana Cake Studio
        </div>

        <div class="admin-right">

            <span>Admin Panel</span>

            <a href="index.html">
                View Website
            </a>

        </div>

    </header>


    <main class="admin-container">


        <!-- ADD CAKE -->

        <section class="admin-form-section">

            <div class="section-title">

                <p>CAKE MANAGEMENT</p>

                <h1>Add New Cake</h1>

                <span>
                    Add your cake details and publish them to your collection.
                </span>

            </div>


            <form id="cakeForm">


                <div class="form-grid">


                    <!-- CAKE NAME -->

                    <div class="form-group">

                        <label for="cakeName">
                            Cake Name
                        </label>

                        <input
                            type="text"
                            id="cakeName"
                            placeholder="Example: Black Forest Cake"
                            required
                        >

                    </div>



                    <!-- CATEGORY -->

                    <div class="form-group">

                        <label for="cakeCategory">
                            Category
                        </label>

                        <select id="cakeCategory" required>

                            <option value="">
                                Select Category
                            </option>

                            <option value="birthday">
                                Birthday
                            </option>

                            <option value="anniversary">
                                Anniversary
                            </option>

                            <option value="wedding">
                                Wedding
                            </option>

                            <option value="custom">
                                Custom
                            </option>

                        </select>

                    </div>



                    <!-- STYLE -->

                    <div class="form-group">

                        <label for="cakeStyle">
                            Cake Style
                        </label>

                        <input
                            type="text"
                            id="cakeStyle"
                            placeholder="Example: Classic"
                        >

                    </div>



                    <!-- WEIGHT -->

                    <div class="form-group">

                        <label for="cakeWeight">
                            Weight
                        </label>

                        <input
                            type="text"
                            id="cakeWeight"
                            placeholder="Example: 1 KG"
                        >

                    </div>



                    <!-- FLAVOUR -->

                    <div class="form-group">

                        <label for="cakeFlavour">
                            Flavour
                        </label>

                        <input
                            type="text"
                            id="cakeFlavour"
                            placeholder="Example: Chocolate"
                        >

                    </div>



                    <!-- PRICE -->

                    <div class="form-group">

                        <label for="cakePrice">
                            Price (₹)
                        </label>

                        <input
                            type="number"
                            id="cakePrice"
                            placeholder="Example: 899"
                            required
                        >

                    </div>

                </div>



                <!-- DESCRIPTION -->

                <div class="form-group full-width">

                    <label for="cakeDescription">
                        Description
                    </label>

                    <textarea
                        id="cakeDescription"
                        rows="5"
                        placeholder="Write a short description about the cake..."
                        required
                    ></textarea>

                </div>



                <!-- IMAGE -->

                <div class="form-group full-width">

                    <label for="cakeImage">
                        Cake Photo
                    </label>

                    <input
                        type="file"
                        id="cakeImage"
                        accept="image/*"
                        required
                    >

                </div>



                <!-- IMAGE PREVIEW -->

                <div
                    id="imagePreview"
                    class="image-preview"
                >

                    <span>
                        Image preview will appear here
                    </span>

                </div>



                <!-- BUTTON -->

                <button
                    type="submit"
                    class="add-cake-btn"
                >

                    + Add Cake

                </button>


            </form>

        </section>



        <!-- CURRENT CAKES -->

        <section class="current-cakes-section">


            <div class="current-heading">

                <div>

                    <p>
                        YOUR COLLECTION
                    </p>

                    <h2>
                        Current Cakes
                    </h2>

                </div>


                <span id="adminCakeCount">
                    0 Cakes
                </span>

            </div>



            <div
                id="adminCakeList"
                class="admin-cake-list"
            >

                <!-- Cakes will appear here -->

            </div>


            <div
                id="adminEmptyState"
                class="admin-empty-state"
            >

                <div>
                    🍰
                </div>

                <h3>
                    No cakes added yet
                </h3>

                <p>
                    Add your first cake using the form above.
                </p>

            </div>


        </section>


    </main>


    <script src="admin.js"></script>

</body>

</html>
