<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login | Sabana Cake Studio</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-logo">
                🍰
            </div>


            <h1>
                Sabana Cake Studio
            </h1>


            <p class="login-subtitle">
                Admin Panel
            </p>


            <form id="loginForm">

                <div class="input-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="showPassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div
                    id="loginError"
                    class="login-error"
                ></div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login to Admin
                </button>

            </form>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Website
            </a>

        </div>

    </div>


    <script>

        const ADMIN_USERNAME = "Sabanacakestudio@2004";

        const ADMIN_PASSWORD = "Sabana@2004";


        const loginForm =
            document.getElementById("loginForm");

        const loginError =
            document.getElementById("loginError");


        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const username =
                    document
                        .getElementById("username")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                if (
                    username === ADMIN_USERNAME &&
                    password === ADMIN_PASSWORD
                ) {

                    sessionStorage.setItem(
                        "sabanaAdminLoggedIn",
                        "true"
                    );


                    window.location.href =
                        "admin.html";

                } else {

                    loginError.textContent =
                        "Incorrect username or password.";

                }

            }
        );


        document
            .getElementById("showPassword")
            .addEventListener(
                "click",
                function () {

                    const password =
                        document.getElementById("password");


                    if (
                        password.type === "password"
                    ) {

                        password.type = "text";

                        this.textContent = "🙈";

                    } else {

                        password.type = "password";

                        this.textContent = "👁";

                    }

                }
            );

    </script>

</body>

</html>
